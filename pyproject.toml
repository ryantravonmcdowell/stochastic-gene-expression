[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burstkin"
version = "0.1.0"
description = "Stochastic gene expression: exact simulation, master-equation solvers and inference of transcriptional burst kinetics from single-cell counts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan McDowell" }]
keywords = ["systems biology", "stochastic gene expression", "chemical master equation", "single-cell", "transcriptional bursting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mpmath>=1.3"]

[project.scripts]
burstkin = "burstkin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long statistical checks (run with: pytest -m slow)"]
addopts = "-m \"not slow\""
